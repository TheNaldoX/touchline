name: Runtime regression tests

on:
  push:
    branches: ['test/runtime-*']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: touchline-runtime-tests
  cancel-in-progress: false

jobs:
  camera:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Libérer de l'espace disque
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          large-packages: false
      - uses: actions/cache@v4
        with:
          path: unity/Touchline/Library
          key: Library-RuntimeTests-${{ hashFiles('unity/Touchline/Packages/packages-lock.json', 'unity/Touchline/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      - name: Exécuter les régressions du cadrage et du stade dans Unity
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2, architecture stable sans CLI intermédiaire
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/Touchline
          unityVersion: 6000.3.24f1
          customImage: unityci/editor:ubuntu-6000.3.24f1-android-3
          testMode: EditMode
          artifactsPath: runtime-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Régressions du cadrage et du stade
          customParameters: -testFilter Touchline.Tests.BroadcastFramingTests;Touchline.Tests.BroadcastGoalGroundTests034;Touchline.Tests.StadiumAtmosphereTests;Touchline.Tests.StadiumBenchTests;Touchline.Tests.PhoneShortcutsTests;Touchline.Tests.StadiumCrowdGeometryTests;Touchline.Tests.StadiumGeometryTests;Touchline.Tests.StadiumLightingTests;Touchline.Tests.StadiumLookTests;Touchline.Tests.CrowdLifeTests;Touchline.Tests.MatchKitPaletteTests;Touchline.Tests.PlayerKitTests;Touchline.Tests.BoardObjectiveTests;Touchline.Tests.CarrierPressureTests;Touchline.Tests.TempoPassExecutionTests;Touchline.Tests.SalaryConversionTests;Touchline.Tests.RecruitmentDepthTests;Touchline.Tests.ClubRelationshipsTests;Touchline.Tests.LaunchCareerStorageTests;Touchline.Tests.MatchImmersionTests;Touchline.Tests.RecruitmentDepartmentTests
      - name: Vérifier que des tests ont réellement été exécutés
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = []
          for path in Path('runtime-test-results').rglob('*.xml'):
              root = ET.parse(path).getroot()
              if root.tag == 'test-run':
                  reports.append(root)
          assert reports, 'Aucun résultat NUnit'
          cases = {case.attrib['fullname']: case.attrib.get('result')
                   for root in reports for case in root.iter('test-case')}
          assert len(cases) >= 90, f'Résultat incomplet : {len(cases)} cas sur 90 au minimum'
          unsuccessful = {name: result for name, result in cases.items() if result != 'Passed'}
          assert not unsuccessful, f'Cas non réussis : {unsuccessful}'
          for method, count in [('EnteringTheLastThird', 8), ('PortraitDelivery', 2)]:
              actual = sum(method in name for name in cases)
              assert actual == count, f'Régression absente : {method}, {actual}/{count}'
          print(f'{len(cases)} cas Unity réussis, dont les dix nouvelles régressions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Runtime-test-results
          path: runtime-test-results
          if-no-files-found: warn
